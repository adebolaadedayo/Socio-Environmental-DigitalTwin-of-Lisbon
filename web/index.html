<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lisbon Urban Heat & NbS Digital Twin (Scaffold)</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <div id="cesiumContainer"></div>

  <aside id="controlPanel" class="panel">
    <h1>NbS Digital Twin</h1>
    <p class="subtitle">Demonstrator Scaffold</p>

    <label for="scenarioSelect">Scenario</label>
    <select id="scenarioSelect"></select>

    <label for="poiSelect">Focus POI</label>
    <select id="poiSelect"></select>

    <div class="toggles">
      <label><input type="checkbox" id="toggleBuildings" checked> 3D Buildings / DSM</label>
      <label><input type="checkbox" id="toggleLighting"> Sun Lighting</label>
    </div>

    <div id="selectionInfo" class="info-box">
      Click a feature in the scene to inspect attributes.
    </div>
  </aside>

  <script type="module" src="main.js"></script>
</body>
</html>
